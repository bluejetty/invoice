  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ht: 600;\n  font-display: swap;\n  src: url(\"98a8f55c-2725-4433-bd59-bf69e922b315\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n  <script src=\"b9b2948b-5a21-444d-b236-d63905f8a05b\"><\u002Fscript>\n  <script src=\"0dbe4ecd-19e7-4f51-a534-ed9e4aaa3adf\"><\u002Fscript>\n  <style>\n    doc-page:not(:defined){visibility:hidden}\n    html,body{margin:0;background:var(--color-neutral-200,#e6e6e7);}\n    :root{ --font-heading:'Arial Narrow',Arial,sans-serif; --font-body:'Arial Narrow',Arial,sans-serif; }\n    @media print { .no-print{display:none !important;} }\n    .bj-input{border:none;border-bottom:1px solid var(--color-neutral-300);background:transparent;font-family:var(--font-body);font-size:14px;color:var(--color-text);padding:2px 4px;width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;resize:none;}\n    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}\n    input[type=number]{-moz-appearance:textfield;}\n    .bj-input:focus{outline:none;border-bottom-color:var(--color-accent);}\n    .bj-num{text-align:right;}\n    .bj-row-btn{border:none;background:transparent;color:var(--color-accent-700);font-family:var(--font-body);font-size:13px;cursor:pointer;padding:4px 0;}\n    .bj-row-btn:hover{color:var(--color-accent-900);text-decoration:underline;}\n    .bj-del{border:none;background:transparent;color:var(--color-neutral-400);cursor:pointer;font-size:16px;line-height:1;}\n    .bj-del:hover{color:var(--color-accent-700);}\n    /* Invoice page: tight rows so ten service lines and a couple of payments still fit one letter sheet. */\n    .bj-invoice .table td,.bj-invoice .table th{padding:2px 6px;}\n    .bj-invoice .table th{font-size:10px;}\n    .bj-invoice .bj-input{font-size:13px;padding:1px 4px;}\n    .bj-invoice .bj-row-btn{padding:2px 0;font-size:12px;}\n    .bj-invoice .bj-del{font-size:14px;}\n    /* 2-UP print: two half-size copies of the invoice on one landscape letter sheet (built by printTwoUp). */\n    .bj-menu-item{padding:7px 14px;cursor:pointer;letter-spacing:0.02em;}\n    .bj-menu-item:hover{background:var(--color-accent,#5980a6);color:#fff;}\n    #bj-2up{display:none;}\n    .bj-2up-cell{width:5.5in;height:8.5in;overflow:hidden;box-sizing:border-box;padding-top:0.7in;background:#fff;}\n    .bj-2up-cell + .bj-2up-cell{border-left:1px dashed var(--color-neutral-400,#aaa);}\n    .bj-link-row{cursor:pointer;}\n    .bj-link-row:hover sc-raw-td,.bj-link-row:hover td{background:var(--color-accent-100,#e8eef5);}\n    .bj-link-row .bj-input{cursor:pointer;}\n    .bj-link-row .bj-input:focus{border-bottom-color:var(--color-neutral-300);}\n    .editable:focus{outline:2px solid var(--color-accent,#5980a6);outline-offset:-2px;}\n    .editable img{max-width:100%;}\n    @media print{\n      .bj-input{border-bottom:1px solid var(--color-neutral-300)!important;}\n      .bj-del{display:none!important;}\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div class=\"no-print\" style=\"position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--space-4,16px);flex-wrap:wrap;padding:var(--space-3,12px) var(--space-5,20px);background:var(--color-bg,#f2f2f3);border-bottom:1px solid var(--color-neutral-300,#ccc);\">\n  <span style=\"font-family:var(--font-heading);font-size:20px;letter-spacing:0.02em;color:var(--color-text,#1d1f20);\">BLUEJETTY BOOK<\u002Fspan>\n  <div class=\"seg\" style=\"display:flex;\">\n    <button class=\"seg-opt\" style=\"{{ tabCoverStyle }}\" sc-camel-on-click=\"{{ setTabCover }}\">COVER<\u002Fbutton>\n    <button class=\"seg-opt\" style=\"{{ tabNotesStyle }}\" sc-camel-on-click=\"{{ setTabNotes }}\">NOTES<\u002Fbutton>\n    <button class=\"seg-opt\" style=\"{{ tabNewStyle }}\" sc-camel-on-click=\"{{ newInvoice }}\" title=\"Start a blank invoice dated today\">+ NEW INVOICE<\u002Fbutton>\n    <button class=\"seg-opt\" style=\"{{ tabInvoiceStyle }}\" sc-camel-on-click=\"{{ setTabInvoice }}\" title=\"{{ currentInvoiceTitle }}\">CURRENT INVOICE<\u002Fbutton>\n    <button class=\"seg-opt\" style=\"{{ tabLedgerStyle }}\" sc-camel-on-click=\"{{ setTabLedger }}\">LEDGER<\u002Fbutton>\n  <\u002Fdiv>\n  <span style=\"flex:1;\"><\u002Fspan>\n  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ openBook }}\">Open Book<\u002Fbutton>\n  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ saveBook }}\">Save Book<\u002Fbutton>\n  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ openEmail }}\">Email Book<\u002Fbutton>\n  <input type=\"file\" accept=\".json,application/json\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onOpenFile }}\" style=\"display:none;\">\n  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ print }}\" sc-camel-on-context-menu=\"{{ openPrintMenu }}\" title=\"{{ printTitle }}\">Print / Save as PDF<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ printMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"no-print\" style=\"position:fixed;inset:0;z-index:60;\" sc-camel-on-click=\"{{ closePrintMenu }}\" sc-camel-on-context-menu=\"{{ closePrintMenu }}\">\n    <div style=\"position:fixed;top:{{ printMenuTop }};right:{{ printMenuRight }};min-width:230px;background:var(--color-bg,#f2f2f3);border:1px solid var(--color-neutral-300,#ccc);box-shadow:0 4px 14px rgba(0,0,0,0.18);padding:4px 0;font-family:var(--font-body);font-size:13px;\">\n      <div class=\"bj-menu-item\" sc-camel-on-click=\"{{ printPortrait }}\">Print portrait (1 per sheet)<\u002Fdiv>\n      <div class=\"bj-menu-item\" sc-camel-on-click=\"{{ printTwoUp }}\">Print 2-up landscape (2 copies on 1 sheet)<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ emailOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"dialog-backdrop no-print\" style=\"position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;\">\n    <div class=\"dialog\" style=\"width:420px;max-width:92vw;\">\n      <div class= or:var(--color-neutral-600);white-space:nowrap;\">YEAR / PERIOD<\u002Flabel>\n          <input class=\"bj-input\" style=\"text-align:center;font-size:1.2em;\" type=\"text\" value=\"{{ coverYear }}\" sc-camel-on-change=\"{{ setCoverYear }}\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;width:100%;margin-top:10px;\">\n          <label style=\"font-size:12px;letter-spacing:1px;color:var(--color-neutral-600);text-align:left;\">NOTES<\u002Flabel>\n          <div class=\"bj-input\" style=\"border-bottom:1px solid var(--color-neutral-300);min-height:16px;\"><\u002Fdiv>\n          <div class=\"bj-input\" style=\"border-bottom:1px solid var(--color-neutral-300);min-height:16px;\"><\u002Fdiv>\n          <div class=\"bj-input\" style=\"border-bottom:1px solid var(--color-neutral-300);min-height:16px;\"><\u002Fdiv>\n          <div class=\"bj-input\" style=\"border-bottom:1px solid var(--color-neutral-300);min-height:16px;\"><\u002Fdiv>\n          <div class=\"bj-input\" style=\"border-bottom:1px solid var(--color-neutral-300);min-height:16px;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;\"><\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-600);\">Kris Eyvindson · (306) 649-0350 · kris@bluejetty.ca<\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fx-import>\n<\u002Fdiv>\n\n<div style=\"display:{{ invoiceDisplay }};\">\n  <x-import component-from-global-scope=\"doc-page\" from=\"0dbe4ecd-19e7-4f51-a534-ed9e4aaa3adf#/doc-page.js\" size=\"letter\" hint-size=\"100%,auto\">\n    <section class=\"page bj-invoice\" style=\"padding:0.4in 0.6in 0.35in;font-family:var(--font-body);color:var(--color-text);display:flex;flex-direction:column;box-sizing:border-box;background:#fff;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;\">\n        <img src=\"ef508277-d608-44a4-b278-befc78023e61\" style=\"height:92px;width:auto;\" alt=\"Bluejetty Home Design\">\n        <div style=\"text-align:right;font-size:11px;color:var(--color-neutral-700);line-height:1.4;\">\n          <div style=\"font-weight:700;color:var(--color-text);\">Kris Eyvindson<\u002Fdiv>\n          <div>1632 Ave C North, Saskatoon, SK S7K 1L5<\u002Fdiv>\n          <div>(306) 649-0350 · kris@bluejetty.ca<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;\">\n        <div style=\"font-family:var(--font-heading);font-weight:700;font-size:20px;letter-spacing:1px;\">INVOICE / RECEIPT<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;\">\n          <label style=\"font-size:11px;letter-spacing:1px;color:var(--color-neutral-600);\">DATE<\u002Flabel>\n          <input class=\"bj-input\" style=\"width:130px;\" type=\"text\" value=\"{{ date }}\" sc-camel-on-change=\"{{ setDate }}\">\n          <button class=\"btn btn-secondary no-print\" sc-camel-on-click=\"{{ sendToLedger }}\">Send to Ledger<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--color-neutral-300);padding:6px 12px;margin-bottom:8px;\">\n        <div style=\"font-size:11px;letter-spacing:1px;color:var(--color-neutral-600);margin-bottom:4px;\">CUSTOMER INFORMATION<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;\">\n          <div style=\"display:flex;align-items:baseline;gap:8px;\">\n            <label style=\"font-size:12px;color:var(--color-neutral-600);white-space:nowrap;\">Name<\u002Flabel>\n            <input class=\"bj-input\" type=\"text\" value=\"{{ customerName }}\" sc-camel-on-change=\"{{ setCustomerName }}\">\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:8px;\">\n            <label style=\"font-size:12px;color:var(--color-neutral-600);white-space:nowrap;\">Phone<\u002Flabel>\n            <input class=\"bj-input\" type=\"text \"bj-input bj-num\" style=\"font-weight:700;\">${{ totalDisplay }}<\u002Fdiv><\u002Fsc-raw-td>\n            <sc-raw-td class=\"no-print\"><\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-for list=\"{{ lineItems }}\" as=\"item\" hint-placeholder-count=\"1\">\n            <sc-raw-tr>\n              <sc-raw-td><input class=\"bj-input\" type=\"text\" placeholder=\"Description\" style=\"color:{{ item.color }};\" value=\"{{ item.desc }}\" sc-camel-on-change=\"{{ item.onDesc }}\"><\u002Fsc-raw-td>\n              <sc-raw-td><input class=\"bj-input bj-num\" type=\"text\" placeholder=\"0.00\" style=\"color:{{ item.color }};\" value=\"{{ item.amount }}\" sc-camel-on-change=\"{{ item.onAmount }}\"><\u002Fsc-raw-td>\n              <sc-raw-td class=\"no-print\" style=\"text-align:center;\"><button class=\"bj-del\" sc-camel-on-click=\"{{ item.onRemove }}\">×<\u002Fbutton><\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <button class=\"bj-row-btn no-print\" sc-camel-on-click=\"{{ addLineItem }}\">+ Add line<\u002Fbutton>\n\n      <div style=\"display:flex;justify-content:flex-end;margin-top:2px;margin-bottom:6px;\">\n        <div style=\"display:flex;gap:24px;align-items:baseline;margin-right:10px;\">\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:13px;letter-spacing:1px;\">SUBTOTAL<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:18px;\">${{ subtotalDisplay }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:6px;\">\n        <div style=\"font-size:10px;letter-spacing:1px;color:var(--color-neutral-600);margin-bottom:0;\">PAYMENT INSTRUCTIONS<\u002Fdiv>\n        <textarea class=\"bj-input\" rows=\"2\" style=\"min-height:36px;font-size:12px;line-height:1.4;\" value=\"{{ notes }}\" sc-camel-on-change=\"{{ setNotes }}\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <sc- ize:15px;letter-spacing:1px;\">BALANCE DUE<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:24px;color:var(--color-accent-700);\">${{ balanceDisplay }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;\"><\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--color-neutral-600);border-top:1px solid var(--color-neutral-300);padding-top:6px;margin-top:8px;\">\n        * Cheques payable to owner / sole proprietor: Kris Eyvindson\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fx-import>\n<\u002Fdiv>\n\n<div style=\"display:{{ notesDisplay }};\">\n  <x-import component-from-global-scope=\"doc-page\" from=\"0dbe4ecd-19e7-4f51-a534-ed9e4aaa3adf#/doc-page.js\" width=\"{{ pageWidthIn }}\" height=\"{{ pageHeightIn }}\" hint-size=\"100%,auto\">\n    <sc-for list=\"{{ pages }}\" as=\"p\" hint-placeholder-count=\"1\">\n      <section class=\"page\" style=\"position:relative;\">\n        <sc-if value=\"{{ p.canRemove }}\" hint-placeholder-val=\"{{ false }}\">\n          <button class=\"btn btn-icon no-print\" style=\"position:absolute;top:8px;right:8px;z-index:5;\" sc-camel-on-click=\"{{ p.onRemove }}\" title=\"Remove page\">×<\u002Fbutton>\n        <\u002Fsc-if>\n        <div class=\"editable\" sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"true\" ref=\"{{ p.ref }}\" sc-camel-on-paste=\"{{ p.onPaste }}\" sc-camel-on-input=\"{{ p.onInput }}\" style=\"height:100%;box-sizing:border-box;padding:1in;overflow:hidden;font-family:var(--font-body);font-size:14px;line-height:1.6;color:#1d1f20;background:#ffffff;\"><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-for>\n  <\u002Fx-import>\n<\u002Fdiv>\n\n<div style=\"display:{{ ledgerDisplay }};\">\n  <x-import component-from-global-scope=\"doc-page\" from=\"0dbe4ecd-19e7-4f51-a534-ed9e4aaa3adf#/doc-page.js\" width=\"17in\" height=\"11in\" hint-size=\"100%,auto\">\n    <section class=\"page\" style=\"padding:0.5in 0.6in;font-family:var(--font-body);color:var(--color-text);display:flex;flex-direction:column;box-sizing:border-box;background:#fff;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--color-text);padding-bottom:12px;margin-bottom:16px;\">\n        <div style=\"font-family:var(--font-heading);font-weight:700;font-size:28px;letter-spacing:1px;\">ACCOUNTING LEDGER<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-600);\">Bluejetty Home Design<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-raw-table class=\"table\" style=\"margin-bottom:6px;\">\n        <sc-raw-thead>\n          <sc-raw-tr>\n            <sc-raw-th>Client Name<\u002Fsc-raw-th>\n            <sc-raw-th>Job Description<\u002Fsc-raw-th>\n            <sc-raw-th style=\"width:130px;text-align:right;\">Job Total<\u002Fsc-raw-th>\n            <sc-raw-th style=\"width:130px;text-align:right;\">Invoiced To Date<\u002Fsc-raw-th>\n            <sc-raw-th style=\"width:130px;text-align:right;\">Received<\u002Fsc-raw-th>\n            <sc-raw-th style=\"width:130px;text-align:right;\">Balance<\u002Fsc-raw-th>\n            <sc-raw-th class=\"no-print\" style=\"width:24px;\"><\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ ledgerRows }}\" as=\"row\" hint-placeholder-count=\"0\">\n            <sc-raw-tr class=\"{{ row.rowClass }}\" style=\"{{ row.rowStyle }}\" title=\"{{ row.rowTitle }}\" sc-camel-on-click=\"{{ row.onOpen }}\">\n              <sc-raw-td><input class=\"bj-input\" style=\"color:{{ row.color }};\" type=\"text\" value=\"{{ row.client }}\" sc-camel-read-only=\"{{ row.linked }}\" sc-camel-on-change=\"{{ row.onClient }}\"><\u002Fsc-raw-td>\n              <sc-raw-td><input class=\"bj-input\" style=\"color:{{ row.color }};\" type=\"text\" value=\"{{ row.desc }}\" sc-camel-read-only=\"{{ row.linked }}\" sc-camel-on-change=\"{{ row.onDesc }}\"><\u002Fsc-raw-td>\n              <sc-raw-td><input class=\"bj-input bj-num\" style=\"color:{{ row.color }};\" type=\"text\" value=\"{{ row.invoiceTotal }}\" sc-camel-read-only=\"{{ row.linked }}\" sc-camel-on-change=\"{{ row.onInvoiceTotal }}\"><\u002Fsc-raw-td>\n              <sc-raw-td><input class=\"bj-input bj-num\" style=\"color:{{ row.color }};\" type=\"text\" value=\"{{ row.invoiced }}\" sc-camel-read-only=\"{{ row.linked }}\" sc-camel-on-change=\"{{ row.onInvoiced }}\"><\u002Fsc-raw-td>\n              <sc-raw-td><input class=\"bj-input bj-num\" style=\"color:{{ row.color }};\" type=\"text\" value=\"{{ row.received }}\" sc-camel-read-only=\"{{ row.linked }}\" sc-camel-on-change=\"{{ row.onReceived }}\"><\u002Fsc-raw-td>\n              <sc-raw-td style=\"text-align:right;font-weight:700;color:{{ row.color }};\">${{ row.balanceDisplay }}<\u002Fsc-raw-td>\n              <sc-raw-td class=\"no-print\" style=\"text-align:center;\"><button class=\"bj-del\" sc-camel-on-click=\"{{ row.onRemove }}\">×<\u002Fbutton><\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <button class=\"bj-row-btn no-print\" sc-camel-on-click=\"{{ addLedgerRow }}\">+ Add row<\u002Fbutton>\n\n      <div style=\"flex:1;\"><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-top:2px solid var(--color-text);padding-top:14px;margin-top:14px;\">\n        <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n          <div style=\"font-size:11px;letter-spacing:1px;color:var(--color-neutral-600);\">TAX YEAR<\u002Fdiv>\n          <div class=\"seg no-print\" style=\"display:flex;\">\n            <sc-for list=\"{{ taxYears }}\" as=\"y\" hint-placeholder-count=\"1\">\n              <button class=\"seg-opt\" style=\"{{ y.style }}\" sc-camel-on-click=\"{{ y.onPick }}\">{{ y.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-heading);font-weight:700;font-size:14px;letter-spacing:1px;\">{{ taxYearLabel }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--color-neutral-600);\">{{ taxYearNote }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:36px;align-items:baseline;\">\n          <div style=\"display:flex;gap:12px;align-items:baseline;\">\n            <div style=\"font-family:var(--font-heading);font-weight:700;font-size:12px;letter-spacing:1px;color:var(--color-neutral-600);\">RUNNING BALANCE<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--color-neutral-600);\">${{ ledgerBalanceDisplay }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:14px;align-items:baseline;\">\n            <div style=\"font-family:var(--font-heading);font-weight:700;font-size:16px;letter-spacing:1px;\">TOTAL RECEIVED<\u002Fdiv>\n            <div style=\"font-family:var(--font-heading);font-weight:700;font-size:30px;color:var(--color-accent-700);\">${{ ledgerReceivedDisplay }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fx-import>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;emailEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://bluejetty-mail.bluejetty.workers.dev&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Email&quot;},&quot;emailAppId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;bluejetty&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Email&quot;}}\">\n/* Today's date in the DATE field's own style, e.g. \"13 Nov 2026\".\n * Built from the browser's local calendar (Saskatoon, not UTC), so an\n * invoice written late in the evening is not dated tomorrow. */\nfunction todayLabel(now) {\n  const d = now || new Date();\n  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n  return String(d.getDate()).padStart(2, '0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();\n}\n\nconst DEFAULT_NOTES = 'Please pay by e-transfer to kris@bluejetty.ca, or arrange another payment method. Your PROJECT begins once payment is received. Thank You !';\n/* Every invoice in the book gets its own id so a ledger row can point at it\n * (invoiceId on the row) whatever the client is later renamed to. */\nfunction newInvoiceId() { return 'inv-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }\n/* A fresh invoice: dated today, one empty line, the standard payment note. */\nfunction blankInvoice() {\n  return { id: newInvoiceId(), date: todayLabel(), customerName: '', customerPhone: '', customerAddress: '', customerEmail: '',\n    projectNote1: '', projectNote2: '',\n    lineItems: [{ desc: '', amount: '' }], payments: [], notes: DEFAULT_NOTES };\n}\nconst INVOICE_KEYS = ['date', 'customerName', 'customerPhone', 'customerAddress', 'customerEmail', 'projectNote1', 'projectNote2', 'lineItems', 'payments', 'notes'];\n\nclass Component extends DCLogic {\n  state = {\n    tab: 'cover',\n    coverYear: '2026', coverStarted: '', coverBookNo: '1',\n    // The invoice on screen (the CURRENT INVOICE) is kept flat in state; every\n    // invoice of the book, this one included, is also in `invoices` by id.\n    currentId: null,\n    invoices: [],\n    date: todayLabel(), customerName: '', customerPhone: '', customerAddress: '', customerEmail: '',\n    projectNote1: '', projectNote2: '',\n    lineItems: [{ desc: '', amount: '' }], payments: [],\n    notes: DEFAULT_NOTES,\n    pageIds: ['p1'], size: 'letter', orientation: 'portrait',\n    ledgerRows: []\n  };\n\n  constructor(props) {\n    super(props);\n    this.pageCounter = 1;\n    this.editableEls = {};\n    this.inputTimers = {};\n    const first = blankInvoice();\n    this.state.currentId = first.id;\n    this.state.invoices = [first];\n  }\n\n  // ---- many invoices per book ----\n  // The flat invoice fields of state `s`, as one stored invoice.\n  currentFrom(s) {\n    const inv = { id: s.currentId };\n    INVOICE_KEYS.forEach(k => { inv[k] = s[k]; });\n    return inv;\n  }\n  // `invoices` with the on-screen invoice written back over its stored copy.\n  syncedInvoices(s) {\n    const cur = this.currentFrom(s);\n    let seen = false;\n    const out = s.invoices.map(inv => { if (inv.id === cur.id) { seen = true; return cur; } return inv; });\n    if (!seen) out.push(cur);\n    return out;\n  }\n  // The flat fields to put on screen for a stored invoice.\n  flatFrom(inv) {\n    const out = { currentId: inv.id };\n    INVOICE_KEYS.forEach(k => { out[k] = inv[k]; });\n    out.date = String(inv.date ?? '').trim() || todayLabel();\n    out.lineItems = this.withoutHandTotal(Array.isArray(inv.lineItems) ? inv.lineItems : []);\n    out.payments = Array.isArray(inv.payments) ? inv.payments : [];\n    out.notes = inv.notes ?? DEFAULT_NOTES;\n    ['customerName', 'customerPhone', 'customerAddress', 'customerEmail', 'projectNote1', 'projectNote2'].forEach(k => { out[k] = inv[k] ?? ''; });\n    return out;\n  }\n  // Nothing typed on it yet: no customer, no line text or amount, no payment.\n  isBlankInvoice(inv) {\n    const empty = v => String(v || '').trim() === '';\n    return empty(inv.customerName) && empty(inv.customerPhone) && empty(inv.customerAddress) && empty(inv.customerEmail) && empty(inv.projectNote1) && empty(inv.projectNote2)\n      && (inv.lineItems || []).every(it => empty(it.desc) && empty(it.amount)) && !(inv.payments || []).length;\n  }\n  // The stored invoice a ledger row points at, if the book still has it.\n  invoiceOfRow(s, row) {\n    if (!row || !row.invoiceId) return null;\n    return this.syncedInvoices(s).find(inv => inv.id === row.invoiceId) || null;\n  }\n\n  // + NEW INVOICE: stash the one on screen, start a blank one dated today.\n  // A blank invoice already on screen is simply re-dated, not stored twice.\n  newInvoice = () => this.setState(s => {\n    const cur = this.currentFrom(s);\n    if (this.isBlankInvoice(cur)) return { ...this.flatFrom({ ...cur, date: todayLabel() }), tab: 'invoice' };\n    const fresh = blankInvoice();\n    return { ...this.flatFrom(fresh), invoices: [...this.syncedInvoices(s), fresh], tab: 'invoice' };\n  });\n\n  // A press on a linked ledger row: that invoice becomes the CURRENT INVOICE.\n  openInvoice = id => this.setState(s => {\n    const invoices = this.syncedInvoices(s);\n    const inv = invoices.find(x => x.id === id);\n    if (!inv) return null;\n    return { ...this.flatFrom(inv), invoices, tab: 'invoice' };\n  });\n\n  setTabCover = () => this.setState({ tab: 'cover' });\n  setTabInvoice = () => this.setState({ tab: 'invoice' });\n  setTabNotes = () => this.setState({ tab: 'notes' });\n  setTabLedger = () => this.setState({ tab: 'ledger' });\n  // Every hidden doc-page writes its own @page rule into <head>, and the\n  // last one written (the 17x11 ledger) sized every print: the invoice came\n  // out sideways and spilled onto a second sheet. Pin the paper of the tab\n  // on screen just before printing (a later @page rule wins), then take it out.\n  PAPER = { cover: '8.5in 11in', invoice: '8.5in 11in', notes: null, ledger: '17in 11in' };\n  print = (size) => {\n    const tab = this.state.tab;\n    if (typeof size !== 'string') size = this.PAPER[tab];\n    if (tab === 'notes') { const d = this.getDims(); size = d.w + 'in ' + d.h + 'in'; }\n    let tag = document.getElementById('bj-print-page');\n    if (!tag) { tag = document.createElement('style'); tag.id = 'bj-print-page'; }\n    tag.textContent = '@page { size: ' + size + '; margin: 0; }';\n    document.head.appendChild(tag);\n    this.letInvoiceFlow();\n    const done = () => { window.removeEventListener('afterprint', done); if (tag.parentNode) tag.remove(); };\n    window.addEventListener('afterprint', done);\n    window.print();\n  };\n  // doc-page pins every printed page to exactly one sheet and clips the rest\n  // (its own !important rules inside its shadow root, which document CSS\n  // cannot beat). An invoice with more lines than one sheet holds must flow\n  // onto a second sheet instead of losing its bottom, so a later rule goes\n  // into that same shadow root once: the invoice page grows past the sheet.\n  letInvoiceFlow() {\n    document.querySelectorAll('doc-page').forEach(dp => {\n      const root = dp.shadowRoot;\n      if (!root || !dp.querySelector(':scope > .bj-invoice') || root.getElementById('bj-flow')) return;\n      const st = document.createElement('style');\n      st.id = 'bj-flow';\n      st.textContent = '@media print { .paginated ::slotted(.page.bj-invoice) { height: auto !important; min-height: var(--doc-page-h) !important; overflow: visible !important; } }';\n      root.appendChild(st);\n    });\n  }\n  // 2-UP: the invoice twice, side by side on one landscape letter sheet, each\n  // copy scaled to half a sheet (one for the desk, one for the client). The\n  // copies are clones of the invoice on screen, built just for the print and\n  // taken down afterwards; the rest of the page hides while they print.\n  // Right-click on Print / Save as PDF: a small menu of print layouts.\n  openPrintMenu = e => {\n    if (e && e.preventDefault) e.preventDefault();\n    if (this.state.tab !== 'invoice') return;\n    const r = e && e.currentTarget && e.currentTarget.getBoundingClientRect ? e.currentTarget.getBoundingClientRect() : { bottom: 56, right: window.innerWidth - 20 };\n    this.setState({ printMenuOpen: true, printMenuTop: Math.round(r.bottom + 4) + 'px', printMenuRight: Math.max(8, Math.round(window.innerWidth - r.right)) + 'px' });\n  };\n  closePrintMenu = e => { if (e && e.preventDefault) e.preventDefault(); this.setState({ printMenuOpen: false }); };\n  printPortrait = () => { this.setState({ printMenuOpen: false }, () => this.print()); };\n  TWO_UP_SCALE = 5.5 / 8.5;\n  printTwoUp = () => {\n    this.setState({ printMenuOpen: false });\n    const src = document.querySelector('section.bj-invoice');\n    if (!src) return;\n    const old = document.getElementById('bj-2up');\n    if (old) old.remove();\n    const wrap = document.createElement('div');\n    wrap.id = 'bj-2up';\n    for (let k = 0; k < 2; k++) {\n      const cell = document.createElement('div');\n      cell.className = 'bj-2up-cell';\n      const copy = src.cloneNode(true);\n      // Typed values live on the elements, not in the markup: carry them over.\n      const from = src.querySelectorAll('input, textarea'), to = copy.querySelectorAll('input, textarea');\n      from.forEach((el, i) => { if (to[i]) { to[i].value = el.value; if (to[i].tagName === 'TEXTAREA') to[i].textContent = el.value; } });\n      copy.classList.remove('page');\n      copy.style.width = '8.5in'; copy.style.height = '11in'; copy.style.overflow = 'hidden';\n      copy.style.transform = 'scale(' + this.TWO_UP_SCALE.toFixed(4) + ')'; copy.style.transformOrigin = 'top left';\n      copy.style.boxShadow = 'none'; copy.style.borderRadius = '0';\n      cell.appendChild(copy);\n      wrap.appendChild(cell);\n    }\n    document.body.appendChild(wrap);\n    const st = document.createElement('style');\n    st.id = 'bj-2up-style';\n    st.textContent = '@media print { body > :not(#bj-2up) { display: none !important; } #bj-2up { display: flex !important; width: 11in; height: 8.5in; overflow: hidden; } }';\n    document.head.appendChild(st);\n    const done = () => { window.removeEventListener('afterprint', done); wrap.remove(); st.remove(); };\n    window.addEventListener('afterprint', done);\n    this.print('11in 8.5in');\n  };\n\n  addLedgerRow = (row) => this.setState(s => ({ ledgerRows: [...s.ledgerRows, row || { client: '', desc: '', invoiceTotal: '', invoiced: '', received: '' }] }));\n  // What a job has billed so far: the INVOICED TO DATE column, or the old books' INVOICE TOTAL when the column is blank.\n  rowInvoiced(r) { return String(r.invoiced || '').trim() === '' ? this.num(r.invoiceTotal) : this.num(r.invoiced); }\n  removeLedgerRow = i => this.setState(s => ({ ledgerRows: s.ledgerRows.filter((_, idx) => idx !== i) }));\n  updateLedgerRow = (i, key, val) => this.setState(s => ({ ledgerRows: s.ledgerRows.map((r, idx) => idx === i ? { ...r, [key]: val } : r) }));\n\n  // ---- tax year ----\n  // The year written in a free-text date such as \"12 Nov 2026\" or \"2026-11-12\"; 0 when none.\n  yearOf(text) { const m = /\\b(19|20)\\d{2}\\b/.exec(String(text || '')); return m ? +m[0] : 0; }\n  // What a job's invoice received in one tax year: its payments whose METHOD / DATE names that year.\n  // A row with no stored invoice (typed by hand) has no dated payments, so it counts only under ALL.\n  receivedInYear(s, row, year) {\n    const inv = this.invoiceOfRow(s, row);\n    if (!inv) return 0;\n    return (inv.payments || []).reduce((sum, p) => sum + (this.yearOf(p.meta) === year ? this.num(p.amount) : 0), 0);\n  }\n  // Every year named on a payment or an invoice date, newest first.\n  taxYearsOf(s) {\n    const years = new Set();\n    this.syncedInvoices(s).forEach(inv => {\n      const y = this.yearOf(inv.date); if (y) years.add(y);\n      (inv.payments || []).forEach(p => { const py = this.yearOf(p.meta); if (py) years.add(py); });\n    });\n    return [...years].sort((a, b) => b - a);\n  }\n  setTaxYear = year => this.setState({ taxYear: year || 0 });\n\n  // One ledger row per job: a later phase of the same client + job updates its row instead of adding another.\n  sendToLedger = () => {\n    const desc = this.state.lineItems.map(it => it.desc).filter(Boolean).join('; ');\n    const invoiceTotal = this.lineTotal(this.state.lineItems);\n    const invoiced = this.lineDueNow(this.state.lineItems);\n    const received = this.state.payments.reduce((sum, p) => sum + this.num(p.amount), 0);\n    const key = v => String(v || '').trim().toUpperCas
